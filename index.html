<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><meta name="description" content="点一下屏幕，亲手放一场由代码实时生成的烟花。"><meta property="og:type" content="website"><meta property="og:title" content="我让代码在屏幕上放了一场烟花"><meta property="og:description" content="点一下屏幕，亲手放一场烟花。"><meta property="og:url" content="https://oxhorse0804.github.io/wechat-code-fireworks/"><title>代码烟花实验｜点一下放烟花</title><style> :root { color-scheme: dark; --bg: #070b14; --surface: #0b1220; --surface-2: #111b2d; --text: #f7f9ff; --muted: #aebbd2; --line: #26334a; --blue: #4c8dff; --blue-strong: #3479f5; --green: #45e6a4; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; } * { box-sizing: border-box; } html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--text); overscroll-behavior-y: none; } body { background: radial-gradient(circle at 50% 0%, rgba(76, 141, 255, .12), transparent 38%), var(--bg); } button, input { font: inherit; } .shell { width: min(100%, 1040px); margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); } .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 12px; } .eyebrow { margin-bottom: 5px; color: var(--muted); font: 500 11px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .12em; } h1 { margin: 0; font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em; } .readout { display: flex; flex-direction: column; align-items: flex-end; color: var(--muted); font: 400 11px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; text-align: right; } .stage { position: relative; overflow: hidden; width: 100%; aspect-ratio: 16 / 9; min-height: 300px; border: 1px solid var(--line); border-radius: 18px; background: radial-gradient(circle at 50% 86%, rgba(76, 141, 255, .2), transparent 58%), radial-gradient(circle at 14% 10%, rgba(193, 140, 255, .11), transparent 34%), linear-gradient(180deg, #111d35, #070b14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; } canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; } .hint, .coords { position: absolute; bottom: 13px; color: var(--muted); font: 400 11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; pointer-events: none; } .hint { left: 15px; display: flex; align-items: center; gap: 8px; } .hint::before { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(69, 230, 164, .14); content: ""; } .coords { right: 15px; font-variant-numeric: tabular-nums; } .controls { display: flex; flex-wrap: wrap; align-items: end; gap: 9px; margin-top: 13px; } .btn { min-height: 42px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); background: var(--surface-2); cursor: pointer; } .btn:active { transform: translateY(1px); } .btn.primary { border-color: var(--blue); background: var(--blue); color: #fff; } .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); } .density { display: grid; grid-template-columns: auto auto; gap: 2px 10px; width: min(250px, 100%); margin-left: auto; } .density label { color: var(--muted); } .density output { color: var(--muted); font: 400 11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; text-align: right; } .density input { grid-column: 1 / -1; width: 100%; accent-color: var(--blue); } @media (max-width: 560px) { .topbar { align-items: flex-start; flex-direction: column; gap: 7px; } .readout { align-items: flex-start; text-align: left; } .stage { aspect-ratio: auto; height: min(54vh, 430px); min-height: 320px; } .density { width: 100%; margin-left: 0; } .coords { display: none; } } @media (prefers-reduced-motion: reduce) { .hint::before { box-shadow: none; } } </style></head><body><main class="shell"><header class="topbar"><div><div class="eyebrow">LIVE CANVAS / REAL-TIME</div><h1>代码烟花实验</h1></div><div class="readout" aria-live="polite"><span id="call">new Firework(0.50, 0.34)</span><span id="count">0 particles</span></div></header><section class="stage" id="stage" aria-label="交互式烟花画面，点击或拖动即可放烟花"><canvas id="canvas" role="img" aria-label="点击屏幕任意位置发射烟花">你的浏览器需要支持 Canvas 才能显示烟花。</canvas><div class="hint" aria-hidden="true">点一下屏幕，亲手放一场烟花</div><div class="coords" id="coords" aria-hidden="true">x 0.50 / y 0.34</div></section><div class="controls"><button class="btn" id="auto" type="button" aria-pressed="true">自动：开</button><button class="btn primary" id="volley" type="button">齐放三发</button><button class="btn ghost" id="clear" type="button">清空</button><div class="density"><label for="density">粒子密度</label><output id="density-value" for="density">140</output><input id="density" type="range" min="70" max="240" step="10" value="140"></div></div></main><script> (() => { const stage = document.getElementById("stage"); const canvas = document.getElementById("canvas"); const ctx = canvas.getContext("2d"); const autoButton = document.getElementById("auto"); const volleyButton = document.getElementById("volley"); const clearButton = document.getElementById("clear"); const densityInput = document.getElementById("density"); const densityOutput = document.getElementById("density-value"); const callOutput = document.getElementById("call"); const countOutput = document.getElementById("count"); const coordsOutput = document.getElementById("coords"); const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)"); const palette = ["#ff9248", "#ffd95e", "#60a5fa", "#c18cff", "#45e6a4", "#ff637d"]; const rockets = []; const particles = []; const sparks = []; const TAU = Math.PI * 2; let width = 0; let height = 0; let stars = []; let lastTime = performance.now(); let lastLaunch = 0; let autoTimer = 0; const clamp = (v, min, max) => Math.max(min, Math.min(max, v)); const rand = (min, max) => min + Math.random() * (max - min); function resize() { const box = stage.getBoundingClientRect(); const dpr = Math.min(devicePixelRatio || 1, 2); width = Math.max(1, box.width); height = Math.max(1, box.height); canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); const count = Math.max(34, Math.round(width * height / 7400)); stars = Array.from({ length: count }, () => ({ x: Math.random() * width, y: Math.random() * height, r: rand(.45, 1.25), a: rand(.12, .42), phase: rand(0, TAU), speed: rand(.0004, .0012) })); } function explode(x, y, colorIndex, amount) { const primary = palette[colorIndex % palette.length]; const secondary = palette[(colorIndex + 2) % palette.length]; const total = Math.round(amount * (reduceMotion.matches ? .55 : 1)); const spin = rand(0, TAU); const petals = Math.random() > .56 ? 5 : 1; const scale = clamp(width / 720, .72, 1.16); for (let i = 0; i < total; i += 1) { const angle = i / total * TAU + spin + rand(-.035, .035); const wave = petals === 1 ? 1 : .72 + Math.sin(angle * petals) * .28; const speed = rand(1.65, 6.2) * wave * scale; const life = rand(780, 1580); particles.push({ x, y, px: x, py: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, drag: rand(.972, .988), gravity: rand(.024, .05), life, maxLife: life, size: rand(.75, 2.4), color: Math.random() > .25 ? primary : secondary, glitter: Math.random() > .86 }); } for (let i = 0; i < 16; i += 1) { const angle = rand(0, TAU); const speed = rand(.4, 2.3); sparks.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: rand(300, 700), maxLife: 700, color: secondary }); } } function launch(nx, ny) { if (!width || !height) return; const x = clamp(nx, .06, .94); const y = clamp(ny, .12, .68); const colorIndex = Math.floor(Math.random() * palette.length); const amount = Number(densityInput.value); rockets.push({ x: width * (.5 + rand(-.2, .2)), y: height + 12, px: width * .5, py: height + 12, targetX: width * x, targetY: height * y, vy: -rand(8.8, 11.4), color: palette[colorIndex], colorIndex, amount: amount + Math.round(rand(-18, 18)) }); callOutput.textContent = `new Firework(${x.toFixed(2)}, ${y.toFixed(2)})`; countOutput.textContent = `${amount} particles`; coordsOutput.textContent = `x ${x.toFixed(2)} / y ${y.toFixed(2)}`; lastLaunch = performance.now(); } function randomLaunch() { launch(rand(.14, .86), rand(.12, .5)); } function drawStars(time) { ctx.fillStyle = "#f7f9ff"; for (const star of stars) { const twinkle = reduceMotion.matches ? 1 : .72 + Math.sin(time * star.speed + star.phase) * .28; ctx.globalAlpha = star.a * twinkle; ctx.beginPath(); ctx.arc(star.x, star.y, star.r, 0, TAU); ctx.fill(); } ctx.globalAlpha = 1; } function drawRockets() { ctx.lineCap = "round"; for (let i = rockets.length - 1; i >= 0; i -= 1) { const rocket = rockets[i]; rocket.px = rocket.x; rocket.py = rocket.y; rocket.vy += .09; rocket.x += rand(-.32, .32); rocket.y += rocket.vy; if (rocket.y - rocket.targetY <= 0 || rocket.vy >= -.2) { explode(rocket.targetX, rocket.targetY, rocket.colorIndex, rocket.amount); rockets.splice(i, 1); continue; } ctx.globalAlpha = .35; ctx.strokeStyle = rocket.color; ctx.lineWidth = 4.5; ctx.beginPath(); ctx.moveTo(rocket.px, rocket.py); ctx.lineTo(rocket.x, rocket.y); ctx.stroke(); ctx.globalAlpha = .95; ctx.lineWidth = 1.4; ctx.stroke(); } ctx.globalAlpha = 1; } function drawParticles(delta) { ctx.lineCap = "round"; for (let i = particles.length - 1; i >= 0; i -= 1) { const p = particles[i]; p.px = p.x; p.py = p.y; p.vx *= Math.pow(p.drag, delta); p.vy = p.vy * Math.pow(p.drag, delta) + p.gravity * delta; p.x += p.vx * delta; p.y += p.vy * delta; p.life -= delta * 16.67; if (p.life <= 0) { particles.splice(i, 1); continue; } const alpha = clamp(p.life / p.maxLife, 0, 1); const flicker = p.glitter && Math.random() < .22 ? .12 : alpha; ctx.globalAlpha = flicker; ctx.strokeStyle = p.color; ctx.lineWidth = p.size; ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke(); if (p.size > 1.55) { ctx.globalAlpha = flicker * .15; ctx.lineWidth = p.size * 4; ctx.stroke(); } } ctx.globalAlpha = 1; } function drawSparks(delta) { for (let i = sparks.length - 1; i >= 0; i -= 1) { const s = sparks[i]; s.x += s.vx * delta; s.y += s.vy * delta; s.vx *= .97; s.vy = s.vy * .97 + .018 * delta; s.life -= delta * 16.67; if (s.life <= 0) { sparks.splice(i, 1); continue; } ctx.globalAlpha = clamp(s.life / s.maxLife, 0, 1); ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(s.x, s.y, 1.3, 0, TAU); ctx.fill(); } ctx.globalAlpha = 1; } function render(time) { const delta = clamp((time - lastTime) / 16.667, .25, 2.2); lastTime = time; ctx.clearRect(0, 0, width, height); drawStars(time); drawRockets(); drawParticles(delta); drawSparks(delta); requestAnimationFrame(render); } function scheduleAuto() { clearTimeout(autoTimer); if (autoButton.getAttribute("aria-pressed") !== "true") return; autoTimer = setTimeout(() => { randomLaunch(); scheduleAuto(); }, reduceMotion.matches ? 3200 : rand(1000, 1800)); } function setAuto(enabled) { autoButton.setAttribute("aria-pressed", String(enabled)); autoButton.textContent = `自动：${enabled ? "开" : "关"}`; if (enabled) { randomLaunch(); scheduleAuto(); } else { clearTimeout(autoTimer); } } function stagePoint(event) { const box = stage.getBoundingClientRect(); return { x: (event.clientX - box.left) / box.width, y: (event.clientY - box.top) / box.height }; } stage.addEventListener("pointerdown", event => { const point = stagePoint(event); launch(point.x, point.y); stage.setPointerCapture?.(event.pointerId); }); stage.addEventListener("pointermove", event => { if (!(event.buttons || event.pointerType === "touch")) return; if (performance.now() - lastLaunch < 115) return; const point = stagePoint(event); launch(point.x, point.y); }); stage.addEventListener("contextmenu", event => event.preventDefault()); autoButton.addEventListener("click", () => setAuto(autoButton.getAttribute("aria-pressed") !== "true")); volleyButton.addEventListener("click", () => { randomLaunch(); setTimeout(randomLaunch, 115); setTimeout(randomLaunch, 230); }); clearButton.addEventListener("click", () => { rockets.length = 0; particles.length = 0; sparks.length = 0; countOutput.textContent = "0 particles"; }); densityInput.addEventListener("input", () => { densityOutput.textContent = densityInput.value; }); new ResizeObserver(resize).observe(stage); resize(); explode(width * .35, height * .31, 0, 140); explode(width * .7, height * .23, 2, 110); callOutput.textContent = "new Firework(0.35, 0.31)"; countOutput.textContent = "140 particles"; ctx.clearRect(0, 0, width, height); drawStars(performance.now()); drawParticles(1); drawSparks(1); setAuto(!reduceMotion.matches); requestAnimationFrame(render); })(); </script></body></html>
